# Test environment configuration
# Disables automatic collection initialization during full Spring Boot context load
# so ordinary tests do not require a live running Qdrant server.
spring.config.import=optional:classpath:application.properties
qdrant.initialize-collection=false

# Test Database Configuration (In-Memory H2 for isolated test execution)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Test JWT Secret (Valid 32-byte / 256-bit Base64 secret to allow test context load)
app.security.jwt.secret=s+9zXQ3x1J0u4qLw9vM8kR7tY6pA5sD4fG3hJ2kL1z8=
