spring.application.name=backend

# CORS Configuration
# Whitelist local React/Vite development server
app.cors.allowed-origins=http://localhost:5173

# Gemini LLM Configuration
gemini.model=gemini-3.8-flash
gemini.timeout-seconds=30

# Groq Cloud LLM Configuration (Task 2.3)
groq.api-key=${GROQ_API_KEY:}
groq.model=openai/gpt-oss-20b
groq.base-url=https://api.groq.com/openai/v1/chat/completions
groq.timeout-seconds=30
llm.default-provider=${LLM_DEFAULT_PROVIDER:gemini}

# Gemini Embedding Configuration
gemini.embedding-model=gemini-embedding-001
gemini.embedding-dimension=768
gemini.embedding-task-type=SEMANTIC_SIMILARITY

# Vector Store Mode: 'qdrant' (default) or 'memory' (zero-Docker local dev)
cache.vector-store=${CACHE_VECTOR_STORE:qdrant}

# Qdrant Vector Database Configuration
qdrant.host=localhost
qdrant.port=6334
qdrant.use-tls=false
qdrant.api-key=${QDRANT_API_KEY:}
qdrant.collection-name=semantic_cache
qdrant.vector-size=${gemini.embedding-dimension}
qdrant.fail-on-startup-error=true
qdrant.timeout-seconds=10

# Semantic Similarity Search Configuration
search.default-limit=5
search.max-limit=50

# Semantic Cache Configuration
# Initial experimental similarity threshold; calibrate against real query benchmarks in production
cache.similarity-threshold=0.85
cache.max-request-body-bytes=65536

# Stage-2 Cross-Encoder Intent Verification Configuration (ONNX Runtime)
cache.cross-encoder.enabled=true
cache.cross-encoder.model-path=models/ms-marco-MiniLM-L-6-v2.onnx
cache.cross-encoder.vocab-path=models/vocab.txt
cache.cross-encoder.stage1-threshold=0.75
cache.cross-encoder.threshold=0.85
cache.cross-encoder.top-k=3
cache.cross-encoder.max-sequence-length=256
cache.cross-encoder.fail-on-missing-model=false

# Novel Semantic Density & Cost-Weighted Eviction Configuration (Task 2.2)
cache.eviction.enabled=true
cache.eviction.max-entries=10000
cache.eviction.k-tail=100
cache.eviction.weight-recency=0.30
cache.eviction.weight-frequency=0.25
cache.eviction.weight-density=0.25
cache.eviction.weight-cost=0.20
cache.eviction.recency-decay-per-hour=0.05

# Relational Database Configuration (File-backed H2 for local development)
spring.datasource.url=jdbc:h2:file:./data/authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Security & Cookie Configuration
app.security.jwt.secret=${JWT_SECRET:}
app.security.cookie.secure=false
app.security.cookie.same-site=Lax
